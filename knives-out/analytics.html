<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>KNIVES OUT — Live Analytics</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<style>
:root {
  --ink: #060405; --ink2: #0e0809; --ink3: #160d10; --ink4: #1f1216;
  --seam: #352428; --seam2: #4a2f38;
  --blade: #c41e3a; --blade2: #8b1529;
  --blood: #dc2626; --blood2: #991b1b; --blood3: #450a0a;
  --cream: #ede4e0; --cream2: #b8a4a0; --cream3: #6b5558;
  --alive: #2d6a3e; --alive2: #1a4a28; --ghost: #5c3a6a; --ghost2: #d8a8e8;
}
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; overflow-x: hidden; }
body {
  background: var(--ink);
  background-image: radial-gradient(ellipse at 50% -20%, rgba(139, 21, 41, 0.2) 0%, transparent 50%);
  color: var(--cream2);
  font-family: 'Courier Prime', monospace;
  min-height: 100vh;
  line-height: 1.6;
  overflow-x: hidden;
  padding-bottom: 60px;
}
body::after {
  content: '';
  position: fixed; inset: 0;
  background: repeating-linear-gradient(0deg, transparent, transparent 28px, rgba(255,255,255,0.012) 28px, rgba(255,255,255,0.012) 29px),
              repeating-linear-gradient(90deg, transparent, transparent 28px, rgba(255,255,255,0.006) 28px, rgba(255,255,255,0.006) 29px);
  pointer-events: none; z-index: 0;
}

.wrap { position: relative; z-index: 1; max-width: 900px; margin: 0 auto; padding: 18px 14px 0; }
@media (min-width: 700px) { .wrap { padding: 32px 24px 0; } }

.top-header { text-align: center; margin-bottom: 20px; }
.top-logo { font-family: 'Playfair Display', serif; font-size: 30px; font-weight: 900; font-style: italic; color: var(--cream); letter-spacing: 2px; }
.top-logo span { color: var(--blade); }
.top-sub { font-size: 9px; letter-spacing: 3px; color: var(--cream3); text-transform: uppercase; margin-top: 4px; }
@media (min-width: 700px) { .top-logo { font-size: 40px; } }

#conn-banner {
  display: none;
  text-align: center;
  font-size: 10px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  padding: 10px;
  margin-bottom: 16px;
  border: 1px solid var(--blade);
  background: var(--blood3);
  color: var(--blade);
}
#conn-banner.show { display: block; }

.card { background: var(--ink2); border: 1px solid var(--seam); padding: 16px; margin-bottom: 16px; overflow-x: auto; width: 100%; }
@media (min-width: 600px) { .card { padding: 24px; margin-bottom: 20px; } }
.card-title { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--cream3); margin-bottom: 16px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.card-title::after { content: ''; flex: 1; height: 1px; background: var(--seam); min-width: 20px; }
.text-dim { color: var(--cream3); font-size: 11px; }
.text-gold { color: var(--blade); }
.text-green { color: var(--alive); }

.badge { display: inline-block; padding: 4px 8px; font-size: 8px; letter-spacing: 1.5px; text-transform: uppercase; font-weight: 700; white-space: nowrap; border-radius: 2px; }
.badge-alive { background: var(--alive2); color: var(--alive); border: 1px solid var(--alive2); }
.badge-dead { background: var(--blood3); color: var(--blood); border: 1px solid var(--blood2); }
.badge-immune { background: #1a2a4a; color: #7db8ff; border: 1px solid #3a5a8a; }
.badge-ghost { background: #2a1f4a; color: var(--ghost2); border: 1px solid var(--ghost); }

.mod-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 16px; }
@media (min-width: 600px) { .mod-grid { grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; } }
.stat-box { background: var(--ink2); border: 1px solid var(--seam); padding: 16px 10px; text-align: center; }
.stat-num { font-family: 'Playfair Display', serif; font-size: 26px; font-weight: 900; color: var(--cream); line-height: 1; }
@media (min-width: 600px) { .stat-num { font-size: 36px; } }
.stat-label { font-size: 9px; letter-spacing: 1.5px; color: var(--cream3); text-transform: uppercase; margin-top: 6px; }
.stat-num.red { color: var(--blood); }
.stat-num.green { color: var(--alive); }
.stat-num.gold { color: var(--blade); }
.stat-num.purple { color: var(--ghost2); }

.analytics-session-card { border-left: 3px solid var(--blade); background: linear-gradient(135deg, var(--ink2) 0%, rgba(26,42,74,.35) 100%); }
.analytics-live-elapsed { font-family: 'Playfair Display', serif; font-size: clamp(34px, 9vw, 56px); font-weight: 900; font-style: italic; color: var(--cream); letter-spacing: 1px; line-height: 1.05; }
.analytics-live-ist-sub { font-family: 'Courier Prime', monospace; font-size: 13px; color: var(--cream3); letter-spacing: 1px; }
.analytics-pulse-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--alive); box-shadow: 0 0 8px var(--alive); animation: analyticsPulse 1.5s ease-in-out infinite; margin-right: 8px; vertical-align: middle; }
@keyframes analyticsPulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }

.analytics-metric-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-top: 12px; }
.analytics-metric { padding: 12px 14px; background: var(--ink3); border: 1px solid var(--seam); border-radius: 2px; }
.analytics-metric-label { font-size: 8px; letter-spacing: 2px; text-transform: uppercase; color: var(--cream3); margin-bottom: 6px; }
.analytics-metric-value { font-size: 15px; font-weight: 700; color: var(--cream); line-height: 1.3; }
.analytics-metric-value.danger { color: var(--blood); }

.analytics-tl-tooltip { margin-top: 10px; padding: 12px; background: var(--ink3); border: 1px solid var(--seam); border-left: 3px solid var(--blood); font-size: 10px; line-height: 1.6; min-height: 48px; }
.analytics-tl-bar { cursor: pointer; transition: opacity .15s; touch-action: manipulation; }
.analytics-tl-bar:hover, .analytics-tl-bar:active { opacity: 1 !important; }

.footer-note { text-align: center; font-size: 9px; letter-spacing: 1.5px; color: var(--cream3); text-transform: uppercase; margin-top: 24px; opacity: .7; }
.footer-note span { color: var(--blade); }
</style>
</head>
<body>

<div class="wrap">
  <div class="top-header">
    <div class="top-logo">KNIVES <span>OUT</span></div>
    <div class="top-sub">Live Analytics</div>
  </div>

  <div id="conn-banner"></div>

  <div class="card analytics-session-card">
    <div style="display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:16px;">
      <div style="min-width:200px;">
        <div style="font-size:9px;letter-spacing:3px;color:var(--cream3);text-transform:uppercase;margin-bottom:8px;"><span class="analytics-pulse-dot"></span>GAME ELAPSED</div>
        <div id="analytics-live-elapsed" class="analytics-live-elapsed">—</div>
        <div style="margin-top:10px;display:flex;flex-wrap:wrap;align-items:center;gap:8px;">
          <span id="analytics-live-ist" class="analytics-live-ist-sub">--:--:-- IST</span>
          <span id="analytics-live-meta" class="text-dim" style="font-size:9px;letter-spacing:1px;">Waiting for sync…</span>
        </div>
      </div>
      <div id="analytics-session-strip" style="flex:1;min-width:min(100%,320px);"></div>
    </div>
  </div>

  <div class="mod-grid" id="analytics-stat-grid" style="grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));"></div>

  <div class="card">
    <div class="card-title">KILL ACTIVITY BY HOUR (IST)</div>
    <div id="analytics-hour-heatmap"></div>
  </div>

  <div class="footer-note">Read-only view <span>·</span> updates live</div>
</div>

<script>
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBEBdPwtgVpOEXJZD-n19nusn95Cxmar_E",
  authDomain: "knives-out-78089.firebaseapp.com",
  databaseURL: "https://knives-out-78089-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "knives-out-78089",
  appId: "1:873187343032:web:f0d7da214389437965524d"
};

let db = null;
let gameState = null;
let _analyticsLiveInterval = null;

// ---------- helpers (ported from mod page) ----------
function getDefaultState() {
  return {
    gameStarted: false, gameStartedAt: null, gamePaused: false, gamePausedAt: null,
    gameEnded: false, gameEndedAt: null, gameEndResult: null, killChainOrder: [],
    players: [], mods: [], killLog: [], auditLog: [], pendingCodes: {},
    settings: { immunityEnabled: true, ghostEnabled: true },
    immunity: { start: null, end: null, immunePlayers: [] },
    ghost: { phase: 0, revived: [] }
  };
}

function getCanonicalImmunePlayers(imm) {
  if (Array.isArray(imm?.immunePlayers)) return imm.immunePlayers;
  return [];
}

function normalizeState(raw) {
  const base = getDefaultState();
  const merged = raw ? { ...base, ...raw } : base;
  merged.players = Array.isArray(merged.players) ? merged.players : [];
  merged.mods = Array.isArray(merged.mods) ? merged.mods : [];
  merged.killLog = Array.isArray(merged.killLog) ? merged.killLog : [];
  if (Array.isArray(merged.auditLog)) {
    merged.auditLog = merged.auditLog;
  } else if (merged.auditLog && typeof merged.auditLog === 'object') {
    merged.auditLog = Object.values(merged.auditLog).sort((a, b) => {
      const at = Number(a?.ts) || new Date(a?.iso || 0).getTime() || 0;
      const bt = Number(b?.ts) || new Date(b?.iso || 0).getTime() || 0;
      return at - bt;
    });
  } else {
    merged.auditLog = [];
  }
  merged.settings = merged.settings || { immunityEnabled: true, ghostEnabled: true };

  if (merged.gameStarted && !merged.gameStartedAt) {
    const sortedKills = [...(merged.killLog || [])].sort((a, b) => new Date(a.time) - new Date(b.time));
    const startEv = (merged.auditLog || []).find(e => e.action === 'game.started');
    merged.gameStartedAt = startEv?.iso || startEv?.ts || sortedKills[0]?.time || null;
  }
  merged.gamePaused = Boolean(merged.gamePaused);
  merged.gameEnded = Boolean(merged.gameEnded);

  const rawImm = { ...base.immunity, ...(merged.immunity || {}) };
  merged.immunity = {
    ...rawImm,
    immunePlayers: getCanonicalImmunePlayers(rawImm)
  };
  merged.ghost = {
    ...base.ghost,
    ...(merged.ghost || {}),
    phase: merged.ghost?.phase || 0,
    revived: Array.isArray(merged.ghost?.revived) ? merged.ghost.revived : []
  };
  return merged;
}

function isModUser(state, username) {
  const normalized = String(username).trim().toLowerCase();
  return (state.mods || []).some(m => String(m).trim().toLowerCase() === normalized);
}

function getCurrentIstDate() {
  const now = new Date();
  const istString = now.toLocaleString("en-US", { timeZone: "Asia/Kolkata" });
  return new Date(istString);
}

function getIstClockString(now) {
  const d = now || getCurrentIstDate();
  const h = String(d.getHours()).padStart(2, '0');
  const m = String(d.getMinutes()).padStart(2, '0');
  const s = String(d.getSeconds()).padStart(2, '0');
  return `${h}:${m}:${s}`;
}

function formatDurationMs(ms, compact) {
  if (ms == null || Number.isNaN(ms) || ms < 0) return '—';
  const sec = Math.floor(ms / 1000);
  const min = Math.floor(sec / 60);
  const hr = Math.floor(min / 60);
  const day = Math.floor(hr / 24);
  if (day > 0) {
    if (compact) return `${day}d ${hr % 24}h`;
    return `${day}d ${hr % 24}h ${min % 60}m ${sec % 60}s`;
  }
  if (hr > 0) return compact ? `${hr}h ${min % 60}m` : `${hr}h ${min % 60}m ${sec % 60}s`;
  if (min > 0) return `${min}m ${sec % 60}s`;
  return `${sec}s`;
}

function getGameStartMs() {
  if (!gameState) return null;
  if (gameState.gameStartedAt) {
    const t = new Date(gameState.gameStartedAt).getTime();
    if (!Number.isNaN(t)) return t;
  }
  const kills = [...(gameState.killLog || [])].sort((a, b) => new Date(a.time) - new Date(b.time));
  if (kills.length) return new Date(kills[0].time).getTime();
  return null;
}

function getWinner(state) {
  if (!state?.gameEnded) return null;
  const realPlayers = state.players.filter(p => !isModUser(state, p.name));
  const alive = realPlayers.filter(p => p.status === 'alive');
  if (alive.length === 1) return alive[0];
  return null;
}

// ---------- connection banner ----------
function setConnBanner(text, show) {
  const el = document.getElementById('conn-banner');
  if (!el) return;
  el.textContent = text;
  el.classList.toggle('show', !!show);
}

// ---------- live clock + top strip ----------
function stopAnalyticsLiveClock() {
  if (_analyticsLiveInterval) { clearInterval(_analyticsLiveInterval); _analyticsLiveInterval = null; }
}
function startAnalyticsLiveClock() {
  stopAnalyticsLiveClock();
  updateAnalyticsLivePanel();
  _analyticsLiveInterval = setInterval(updateAnalyticsLivePanel, 1000);
}

function updateAnalyticsLivePanel() {
  if (!gameState) return;
  const istNow = getCurrentIstDate();
  const nowMs = istNow.getTime();
  const elapsedEl = document.getElementById('analytics-live-elapsed');
  const clockEl = document.getElementById('analytics-live-ist');
  const metaEl = document.getElementById('analytics-live-meta');
  const stripEl = document.getElementById('analytics-session-strip');
  const startMs = getGameStartMs();

  if (elapsedEl) {
    if (gameState.gameStarted && startMs) {
      elapsedEl.textContent = formatDurationMs(nowMs - startMs, false);
    } else if (gameState.gameStarted) {
      elapsedEl.textContent = '0s';
    } else {
      elapsedEl.textContent = '—';
      elapsedEl.style.color = 'var(--cream3)';
    }
    if (gameState.gameStarted && startMs) elapsedEl.style.color = 'var(--cream)';
  }
  if (clockEl) clockEl.textContent = `${getIstClockString(istNow)} IST`;
  if (metaEl) {
    if (gameState.gameEnded) metaEl.textContent = 'Game ended';
    else if (gameState.gamePaused) metaEl.textContent = 'Game paused';
    else metaEl.textContent = gameState.gameStarted ? 'Game in progress' : 'Lobby — not started';
  }
  if (!stripEl) return;

  const realPlayers = gameState.players.filter(p => !isModUser(gameState, p.name));
  const killLog = gameState.killLog || [];
  const hourAgo = nowMs - 3600000;
  const killsLastHour = killLog.filter(k => new Date(k.time).getTime() >= hourAgo).length;

  const sortedKills = [...killLog].sort((a, b) => new Date(a.time) - new Date(b.time));
  const lastKillMs = sortedKills.length ? new Date(sortedKills[sortedKills.length - 1].time).getTime() : null;
  let sinceLastKill = '—';
  if (lastKillMs) sinceLastKill = formatDurationMs(nowMs - lastKillMs, true);

  stripEl.innerHTML = `
    <div class="analytics-metric-grid">
      <div class="analytics-metric">
        <div class="analytics-metric-label">Since last kill</div>
        <div class="analytics-metric-value">${sinceLastKill}</div>
      </div>
      <div class="analytics-metric">
        <div class="analytics-metric-label">Kills (last hour)</div>
        <div class="analytics-metric-value danger">${killsLastHour}</div>
      </div>
    </div>
  `;
}

function escapeHtml(value) {
  return String(value ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// ---------- main render ----------
function renderModAnalytics() {
  if (!gameState) return;
  const realPlayers = gameState.players.filter(p => !isModUser(gameState, p.name));
  const alive = realPlayers.filter(p => p.status === 'alive');
  const dead = realPlayers.filter(p => p.status === 'dead');
  const ghosts = realPlayers.filter(p => p.status === 'ghost');
  const immune = gameState.settings.immunityEnabled ? gameState.immunity.immunePlayers : [];
  const killLog = gameState.killLog || [];
  const total = realPlayers.length;
  const totalKills = killLog.length;
  const survivalPct = total > 0 ? Math.round((alive.length / total) * 100) : 0;

  const winner = getWinner(gameState);

  document.getElementById('analytics-stat-grid').innerHTML = `
    ${winner ? `<div class="stat-box" style="grid-column:1/-1;border-top:3px solid var(--blade);padding:18px;text-align:center;">
      <div style="font-size:9px;letter-spacing:3px;color:var(--blade);text-transform:uppercase;margin-bottom:4px;">🏆 WINNER</div>
      <div style="font-family:'Playfair Display',serif;font-size:28px;font-weight:900;font-style:italic;color:var(--blade);">${escapeHtml(winner.name)}</div>
      <div style="font-size:10px;color:var(--cream3);margin-top:4px;">Last one standing · ${winner.kills || 0} kill${(winner.kills || 0) !== 1 ? 's' : ''}</div>
    </div>` : ''}
    <div class="stat-box"><div class="stat-num green">${alive.length}</div><div class="stat-label">Alive</div></div>
    <div class="stat-box"><div class="stat-num red">${dead.length}</div><div class="stat-label">Eliminated</div></div>
    <div class="stat-box"><div class="stat-num purple">${ghosts.length}</div><div class="stat-label">Ghosts</div></div>
    <div class="stat-box"><div class="stat-num gold">${immune.length}</div><div class="stat-label">Immune</div></div>
    <div class="stat-box"><div class="stat-num">${survivalPct}%</div><div class="stat-label">Survival Rate</div></div>
    <div class="stat-box"><div class="stat-num red">${totalKills}</div><div class="stat-label">Total Kills</div></div>
  `;

  // Hour bar graph (IST)
  const heatEl = document.getElementById('analytics-hour-heatmap');
  if (heatEl) {
    const hourCounts = new Array(24).fill(0);
    killLog.forEach(k => {
      const d = new Date(k.time);
      const ist = new Date(d.toLocaleString('en-US', { timeZone: 'Asia/Kolkata' }));
      hourCounts[ist.getHours()]++;
    });
    const maxH = Math.max(...hourCounts, 1);
    const nowH = getCurrentIstDate().getHours();
    const GW = 520, GH = 100, PAD = 4, BOTTOM = 18;
    const bw = (GW - PAD * 2) / 24 - 2;
    const bars = hourCounts.map((c, h) => {
      const bh = c === 0 ? 2 : Math.max(4, (c / maxH) * (GH - BOTTOM - 8));
      const x = PAD + h * ((GW - PAD * 2) / 24);
      const y = GH - BOTTOM - bh;
      const isCurrent = h === nowH;
      const fill = isCurrent ? 'var(--blade)' : 'var(--blood)';
      const opacity = c === 0 ? 0.15 : isCurrent ? 1 : 0.85;
      return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}"
        fill="${fill}" opacity="${opacity}" rx="2"
        style="cursor:default"
        title="${h}:00 IST — ${c} kill${c !== 1 ? 's' : ''}">
        <title>${h}:00–${h + 1}:00 IST · ${c} kill${c !== 1 ? 's' : ''}</title>
      </rect>` +
        (c > 0 ? `<text x="${(x + bw / 2).toFixed(1)}" y="${(y - 3).toFixed(1)}" text-anchor="middle" font-size="7" fill="var(--cream3)" font-family="monospace" pointer-events="none">${c}</text>` : '') +
        (h % 3 === 0 || isCurrent ? `<text x="${(x + bw / 2).toFixed(1)}" y="${(GH - 4).toFixed(1)}" text-anchor="middle" font-size="${isCurrent ? 8 : 7}" fill="${isCurrent ? 'var(--blade)' : 'var(--cream3)'}" font-family="monospace" font-weight="${isCurrent ? '700' : '400'}" pointer-events="none">${h}</text>` : '');
    }).join('');
    heatEl.innerHTML = `<div style="overflow-x:auto;">
      <svg viewBox="0 0 ${GW} ${GH}" width="100%" height="${GH}" preserveAspectRatio="xMidYMid meet" style="min-width:280px;display:block;">
        <line x1="${PAD}" y1="${GH - BOTTOM}" x2="${GW - PAD}" y2="${GH - BOTTOM}" stroke="var(--seam)" stroke-width="1"/>
        ${bars}
      </svg>
    </div>
    <div style="display:flex;justify-content:space-between;font-size:9px;color:var(--cream3);margin-top:4px;letter-spacing:1px;">
      <span>00:00 IST</span>
      <span style="color:var(--blade);">▌ current hour</span>
      <span>23:00 IST</span>
    </div>`;
  }
}

// ---------- firebase wiring ----------
function initFirebase() {
  try {
    if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
    db = firebase.database();
  } catch (e) {
    setConnBanner('Could not connect to live data.', true);
    return;
  }

  const connRef = db.ref('.info/connected');
  connRef.on('value', snap => {
    if (snap.val() === true) {
      setConnBanner('', false);
    } else {
      setConnBanner('Reconnecting…', true);
    }
  });

  const stateRef = db.ref('/game');
  stateRef.on('value', snap => {
    gameState = normalizeState(snap.val());
    renderModAnalytics();
    if (!_analyticsLiveInterval) startAnalyticsLiveClock();
    else updateAnalyticsLivePanel();
  }, err => {
    setConnBanner('Live sync error. Retrying…', true);
  });
}

document.addEventListener('DOMContentLoaded', initFirebase);
</script>
</body>
</html>
